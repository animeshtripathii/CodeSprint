version: '3.9'

services:
  mongo:
    image: mongo:7
    container_name: kanban_mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: kanban

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: kanban_server
    restart: unless-stopped
    ports:
      - '5000:5000'
    env_file:
      - ./server/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/kanban
    depends_on:
      - mongo
    volumes:
      - ./server/src:/app/src

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: kanban_client
    restart: unless-stopped
    ports:
      - '5173:5173'
    env_file:
      - ./client/.env
    depends_on:
      - server
    volumes:
      - ./client/src:/app/src
      - ./client/index.html:/app/index.html

volumes:
  mongo_data:
